[project]
name = "p6checker"
version = "0.1.0"
description = "A small checker for Primavera P6 .xer schedule exports: parses the file, quarantines broken rows, runs schedule-health checks and draws a float chart."
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
p6check = "p6checker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["p6checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
